# Sources the daily brief reads. Adding/removing a source means editing this
# file only — no code changes.
#
# category steers which section an item is likely to land in:
#   news    → 今日大事 (headlines) candidates
#   macro   → 今日大事, macro/economic releases
#   blog    → 项目弹药 (ammo) / 教我新东西 (learn)
#   podcast → 教我新东西 (learn); v1 only includes feeds whose entries carry
#             full text or transcripts in the feed body (no audio transcription yet)
#   paper   → 教我新东西 (learn)
#
# Fetching is honest: a descriptive User-Agent, no browser impersonation.
# Anthropic has no official RSS; the Olshansk/rss-feeds mirror regenerates
# hourly via GitHub Actions (https://github.com/Olshansk/rss-feeds).

sources:
  # --- news ---
  - key: anthropic-news
    name: Anthropic News
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    category: news
  - key: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    category: news
  - key: deepmind
    name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    category: news

  # --- macro / economy ---
  # BLS 官方 RSS 会 403 一切非浏览器请求(站点级反爬,伪装 UA 也没用),
  # CPI/就业数据日改由 Calculated Risk 与 Fed 动态覆盖。
  - key: fed-press
    name: Federal Reserve Press
    url: https://www.federalreserve.gov/feeds/press_all.xml
    category: macro
  - key: calculated-risk
    name: Calculated Risk
    url: https://www.calculatedriskblog.com/feeds/posts/default?alt=rss
    category: macro

  # --- blogs / analysis ---
  - key: simonwillison
    name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    category: blog
  - key: interconnects
    name: Interconnects (Nathan Lambert)
    url: https://www.interconnects.ai/feed
    category: blog
  - key: one-useful-thing
    name: One Useful Thing (Ethan Mollick)
    url: https://www.oneusefulthing.org/feed
    category: blog
  - key: import-ai
    name: Import AI (Jack Clark)
    url: https://importai.substack.com/feed
    category: blog
  - key: stratechery
    name: Stratechery (Ben Thompson)
    url: https://stratechery.com/feed/
    category: blog
  - key: ben-evans
    name: Benedict Evans
    url: https://www.ben-evans.com/benedictevans?format=rss
    category: blog
  - key: pragmatic-engineer
    name: The Pragmatic Engineer (Gergely Orosz)
    url: https://newsletter.pragmaticengineer.com/feed
    category: blog
  - key: ai-snake-oil
    name: AI Snake Oil (Narayanan & Kapoor)
    url: https://www.aisnakeoil.com/feed
    category: blog

  # --- podcasts whose feeds carry full text (no transcription needed) ---
  - key: latent-space
    name: Latent Space
    url: https://www.latent.space/feed
    category: podcast
    lang: en
  - key: dwarkesh
    name: Dwarkesh Podcast
    url: https://www.dwarkesh.com/feed
    category: podcast
    lang: en

  # --- papers ---
  - key: arxiv-cs-ai
    name: arXiv cs.AI (daily)
    url: https://rss.arxiv.org/rss/cs.AI
    category: paper
    max_items: 25

filters:
  # Entries older than this never enter the candidate pool. 30h > 24h so a
  # slightly late daily run still catches yesterday's late posts.
  max_age_hours: 30
  # Per-feed cap before any model sees anything (token-cost guard).
  max_items_per_feed: 10
  # Title hits (case-insensitive) are dropped by rule, before the model —
  # rules first, LLM second keeps costs flat.
  noise_keywords:
    - webinar
    - "we're hiring"
    - hiring
    - "join us"
    - sponsor
    - giveaway
    - "event recap"
    - 招聘
    - 直播预告
